name: pl_image_downloader
description: "A Download image library supports for Android and iOS device"
version: 1.0.0
homepage: https://github.com/NexPlugs/pl_image_downloader
repository: https://github.com/NexPlugs/pl_image_downloader

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.pl_image_downloader
        pluginClass: PlImageDownloaderPlugin
      ios:
        pluginClass: PlImageDownloaderPlugin


topics:  
  - download
  - android 
  - ios